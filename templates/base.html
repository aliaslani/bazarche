<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %} Bazarche {% endblock %}
    </title>
</head>
<body>
    <header>
        <a href="{% url 'catalog: product-list' %}">Bazarche</a>
        {% if user.is_authenticated %} Hi, {{ user }} {% endif %}

    </header>
    {% if messages %}
    {% for message in messages  %}
        <p class="msg {{ message.tags }}"> {{ message }}</p>
    {% endfor %}
    {% endif %}

    <main>
        {% block content %} {% endblock %}
    </main>
</body>
</html>
